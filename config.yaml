# 0DTE / 1DTE bullish call scanner configuration
# Paper trading by default — set live_trading.enabled: true only with a real broker adapter.
#
# Fridays are NOT dropped. prefer_expiry_weekdays includes Mon–Fri.
# Focus list = names with Mon/Wed and/or every-weekday short-dated expiries.

tickers:
  # --- Every weekday 0DTE (Mon–Fri daily expirations) ---
  - SPY
  - QQQ
  - IWM
  - SPX    # Yahoo: ^SPX
  - XSP    # Yahoo: ^XSP (mini-SPX)
  # --- Monday + Wednesday short-dated (plus Friday weeklies) ---
  - GLD
  - SLV
  - TLT
  - SMH
  - XLF
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMD
  - META
  - AMZN
  - GOOGL
  - AVGO
  - INTC
  - MU
  # --- Wednesday-only short-dated ---
  - USO
  - UNG
  # --- Extra liquid Friday weeklies (kept — Fridays not dropped) ---
  - NFLX
  - CRM
  - ORCL
  - ADBE
  - QCOM
  - AMAT
  - ARM
  - PLTR
  - COIN
  - MSTR
  - HOOD
  - UBER
  - JPM
  - BAC
  - XOM
  - COST
  - TSM
  - DIA
  - XLK
  - XLE
  - SOXX
  - HYG
  - EEM
  - SPCX  # SpaceX — recent IPO; include for swing/earnings watch
  - DDOG  # Datadog — liquid mid; promote to focus for options/earnings
  # Most-anticipated earnings darlings (week of Aug 10 2026)
  - CRWV  # CoreWeave
  - CBRS  # Cerebras
  - FLY   # Firefly Aerospace
  - FIGR  # Figure
  - GEMI  # Gemini
  - NBIS  # Nebius
  - BETA  # Beta Technologies
  - XE    # X-Energy
  - CRCL  # Circle — high-attention fintech
  - NOW   # ServiceNow — liquid mega; keep on focus scans
  - SMCI  # Super Micro — earnings today AMC; liquid mid, was missing from focus
  - SE    # Sea Limited — EW this week
  - HIMS  # Hims & Hers — EW this week
  - RKLB  # Rocket Lab — EW this week
  - ASTS  # AST SpaceMobile — EW this week
  - PLUG  # Plug Power — EW this week
  - CSCO  # Cisco — EW this week
  # CRM / AMAT already listed above under Friday weeklies

# Yahoo Finance symbol overrides (indexes need ^ prefix for quotes/chains)
symbol_aliases:
  SPX: "^SPX"
  XSP: "^XSP"

expiry_calendars:
  # Mon–Fri daily short-dated (true everyday 0DTE)
  everyday:
    - SPY
    - QQQ
    - IWM
    - SPX
    - XSP
  # Mon + Wed short-dated (also trade Friday weeklies — Fridays kept)
  monday_wednesday:
    - SPY
    - QQQ
    - IWM
    - SPX
    - XSP
    - GLD
    - SLV
    - TLT
    - SMH
    - XLF
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - AMD
    - META
    - AMZN
    - GOOGL
    - AVGO
    - INTC
    - MU
  wednesday_only:
    - USO
    - UNG
  friday_weeklies:
    - NFLX
    - CRM
    - ORCL
    - ADBE
    - QCOM
    - AMAT
    - ARM
    - PLTR
    - COIN
    - MSTR
    - HOOD
    - UBER
    - JPM
    - BAC
    - XOM
    - COST
    - TSM
    - DIA
    - XLK
    - XLE
    - SOXX
    - SPCX
    - DDOG
    - CRWV
    - CBRS
    - FLY
    - FIGR
    - GEMI
    - NBIS
    - BETA
    - XE
    - CRCL
    - NOW
    - SMCI
    - SE
    - HIMS
    - RKLB
    - ASTS
    - PLUG
    - CSCO
    - HYG
    - EEM

regime:
  spy: SPY
  qqq: QQQ
  vix: "^VIX"
  spx: SPX

# Universe: focus = options 0DTE list; liquid/screener ≈ S&P100+optionables; all = union
universe:
  mode: focus
  # liquid_tickers: []   # optional override of built-in liquid list

scan:
  min_score: 62
  target_move_pct_min: 1.0
  target_move_pct_max: 2.5
  prefer_etfs: true
  lookback_days: 252
  # Boost Mon/Wed/everyday names on those sessions — do NOT exclude Friday names
  prefer_mon_wed_calendar: true
  mon_wed_score_bonus: 4.0
  mon_wed_candidates_only: false
  # Keep Friday-weekly names in scores + candidates every day
  include_friday_weeklies: true

# BUY NOW / SELL NOW thresholds (UI action board)
actions:
  buy_score: 72          # align with 0DTE quality gate
  wait_score: 62         # watchlist / WAIT band
  sell_score: 48         # open call exits when score cools below this
  max_chase_pct: 2.5     # if already up this much in-session, prefer WAIT
  # Only promote BUY NOW when walk-forward hist win clears the bar
  require_hist_win: true
  min_hist_win_pct: 80   # target ≥80% measured win rate on promoted trades
  min_hist_win_samples: 5
  lottery_min_score: 62
  lottery_min_confirms: 4
  # Discord-style radar lane (cheap SPY/QQQ wings) — separate from BUY NOW
  radar_enabled: true
  radar_focus:
    - SPY
    - QQQ
    - IWM
    - DIA
  radar_min_ask: 0.15
  radar_max_ask: 2.50
  radar_otm_pct_max: 1.50
  radar_enrich_live: true   # short Yahoo chain sweep for focus indices only
  # $1k → $1M challenge (swing / LEAP + weekly pace for 4mo→$500k)
  challenge_start_usd: 1000
  challenge_target_usd: 1000000
  challenge_flips: 12
  challenge_max_tickets: 8
  # Prefer weekly-style tickets that can compound to ≥$500k in ~4 months
  challenge_pace_months: 4
  challenge_pace_milestone_usd: 500000
  challenge_prefer_weekly_pace: true
  challenge_fetch_contracts: true
  challenge_fetch_earnings: true
  # Prefetch earnings across liquid universe (cached ~18h; warms ~N/refresh)
  challenge_earnings_max_fetch: 60
  market_board_earnings_max_fetch: 60
  # Flow Desk (Bullflow-inspired) — Yahoo chain ladders for top symbols
  echo_max_symbols: 8
  # Manual Paper ENTER/EXIT in UI (sleeve updates on button click)
  challenge_auto_enter: false
  # Auto EXIT when time-stop / TP / SL / tape fires (was false → ENTERs never closed on Pages)
  challenge_auto_exit: true
  challenge_max_open: 1
  challenge_ledger_path: outputs/challenge_ledger.json
  challenge_min_option_volume: 25
  challenge_min_option_oi: 200
  # Soft EXIT on underlying = wall ± this buffer (call wall − buffer / put wall + buffer)
  wall_exit_buffer_usd: 0.10
  challenge_fetch_walls: true
  # Hold / time-stop (industry desk practice)
  odte_flatten_et: "15:45"       # hard flatten 0DTE by 15:45 ET
  weekly_max_hold_days: 7        # max calendar days for weekly tickets
  rec_log_path: outputs/recommendation_log.json
  # Persist ledgers across Pages builds via Actions cache (see workflow)

options:
  # Look out to ~1 week for best listed call (not only same-day)
  max_dte: 7
  # DTE <= this counts as 0DTE / next-day bucket
  odte_max_dte: 1
  moneyness: atm_to_otm
  # Percent OTM allowed (stocks often use $2.5 / $5 strikes)
  otm_pct_max: 3.0
  itm_pct_max: 1.5
  max_ask: 25.0
  min_open_interest: 50
  min_volume: 10
  per_bucket: 1
  max_candidates_shown: 12
  prefer_expiry_weekdays: [0, 1, 2, 3, 4]
  # Put sleeve: names with bullish ensemble ≤ this get ATM/OTM puts
  include_puts: true
  put_max_bull_score: 48

risk:
  max_contracts_per_trade: 1
  max_trades_per_day: 3
  max_risk_per_trade_usd: 250
  stop_loss_pct: 50
  take_profit_pct: 80

paper_trading:
  enabled: true
  starting_cash: 5000
  ledger_path: outputs/paper_ledger.json

# Signal-driven journal (enter on BUY NOW, exit on SELL NOW) — Intellectia-style track record
journal:
  enabled: true
  path: outputs/signal_journal.json
  starting_cash: 5000
  auto_enter: true
  auto_exit: true
  max_risk_per_trade_usd: 250
  max_open_trades: 5
  max_entries_per_day: 5

# Continuous scanner (premarket / overnight / regular). Not every second — rate limits.
watch:
  enabled: true
  interval_sec: 60          # seconds between cycles (minimum enforced: 15)
  full_scan_every_n: 1      # run full algo+options scan every N cycles
  quote_top_n: 50           # how many names to pull live/extended quotes for
  output_dir: outputs/watch

live_trading:
  enabled: false          # master switch — keep false until Webull keys are set
  broker: webull
  dry_run: true           # log + deep-link only; no broker submit
  sandbox: true           # Webull OpenAPI sandbox host when live
  # Stage BUY/SELL into webull_orders.json on each snapshot / watch (safe with dry_run)
  auto_sync: true
  region: us
  # Credentials via env (preferred): WEBULL_APP_KEY, WEBULL_APP_SECRET, WEBULL_ACCOUNT_ID
  app_key: null
  app_secret: null
  account_id: null
  ledger_path: outputs/webull_orders.json
  # “100% win rate” live gate = historical perfect quality filter (NOT a future guarantee)
  require_perfect_hist: true
  min_hist_win_pct: 100
  min_hist_win_samples: 3
  max_contracts: 1
  max_orders_per_sync: 3
  desks:
    lottery: true         # 0DTE/1DTE convex BUY/SELL NOW
    odte: true
    weekly: true
    swing: true
    challenge: true       # ENTRY/EXIT calls & puts

algos:
  # Legacy flat weights (merged into each horizon as a base)
  weights:
    ema_stack: 1.2
    momentum_breakout: 1.4
    rsi_bounce: 1.0
    macd_momentum: 1.1
    gap_and_go: 1.3
    relative_strength: 1.2
    squeeze_release: 1.1
    vix_regime: 1.0
    volume_thrust: 1.3
  # Horizon-specific overrides (Signa/Intellectia-style separate engines)
  weights_by_horizon:
    0dte:
      gap_and_go: 1.5
      momentum_breakout: 1.5
      volume_thrust: 1.4
      vix_regime: 1.2
    weekly:
      ema_stack: 1.4
      macd_momentum: 1.3
      relative_strength: 1.4
      pullback_entry: 1.3
    swing:
      stage_analysis: 1.6
      trend_structure: 1.5
      pullback_entry: 1.5
      relative_strength_medium: 1.4
      mean_reversion_bottom: 1.2

backtest:
  start: "2023-01-01"
  end: null
  option_payoff_multiplier: 3.0
  option_loss_fraction: 0.65
  # High-conviction filter (same bar as live BUY NOW)
  min_hist_win_pct: 80
  min_hist_win_samples: 5

logging:
  level: INFO
