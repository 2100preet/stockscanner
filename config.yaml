# Yahoo Finance symbol overrides (indexes need ^ prefix for quotes/chains)
symbol_aliases:
  SPX: "^SPX"
  XSP: "^XSP"

expiry_calendars:
  # Mon–Fri daily short-dated (true everyday 0DTE)
  everyday:
    - SPY
    - QQQ
    - IWM
    - SPX
    - XSP
  # Mon + Wed short-dated (also trade Friday weeklies — Fridays kept)
  monday_wednesday:
    - SPY
    - QQQ
    - IWM
    - SPX
    - XSP
    - GLD
    - SLV
    - TLT
    - SMH
    - XLF
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - AMD
    - META
    - AMZN
    - GOOGL
    - AVGO
    - INTC
    - MU
  wednesday_only:
    - USO
    - UNG
  friday_weeklies:
    - NFLX
