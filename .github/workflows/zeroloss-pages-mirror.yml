name: ZeroLoss Pages Mirror

# Publishes the built Signal Desk site to 2100preet/zeroloss GitHub Pages.
# Requires repo secret ZEROLOSS_DEPLOY_TOKEN (PAT with contents:write on zeroloss).

on:
  workflow_run:
    workflows: ["Signal Desk Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stockscanner (site artifact source branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Require deploy token
        env:
          TOKEN: ${{ secrets.ZEROLOSS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::ZEROLOSS_DEPLOY_TOKEN not set — skip zeroloss mirror."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Download site export from triggering run
        if: env.skip != 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: site-export
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build site locally (manual dispatch)
        if: env.skip != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          mkdir -p outputs
          python -m odte_scanner scan --universe focus --no-paper || true
          python -m odte_scanner export-pages --out site

      - name: Push site to zeroloss repo (gh-pages branch)
        if: env.skip != 'true'
        env:
          ZEROLOSS_TOKEN: ${{ secrets.ZEROLOSS_DEPLOY_TOKEN }}
        run: |
          test -f site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${ZEROLOSS_TOKEN}@github.com/2100preet/zeroloss.git" zeroloss-repo
          cd zeroloss-repo
          git checkout -B gh-pages
          rm -rf ./*
          cp -r ../site/* .
          touch .nojekyll
          git add -A
          git diff --staged --quiet && echo "No changes to mirror" && exit 0
          git commit -m "Mirror Signal Desk from stockscanner run ${GITHUB_RUN_ID}"
          git push origin gh-pages --force
