name: Fly Deploy

# Deploys stockscanner.fly.dev from main (sure-winner + challenge resume, etc.)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "odte_scanner/**"
      - "config.yaml"
      - "Dockerfile"
      - "fly.toml"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fly-deploy.yml"

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — add it in repo Settings → Secrets (fly tokens create)"
            exit 1
          fi
          flyctl deploy --remote-only -a stockscanner
