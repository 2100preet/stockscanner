name: Fly Deploy

# Deploys stockscanner.fly.dev from main (sure-winner + challenge resume, etc.)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "odte_scanner/**"
      - "config.yaml"
      - "Dockerfile"
      - "fly.toml"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fly-deploy.yml"

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — add it in repo Settings → Secrets (fly tokens create)"
            exit 1
          fi
          echo "Volumes:"
          flyctl volumes list -a stockscanner || true
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Prefer config mounts; if volume name mismatches, --yes replaces the machine.
          # GIT_SHA / DEPLOYED_AT land on /api/version. They are not secrets.
          if ! flyctl deploy --remote-only -a stockscanner \
              --build-arg GIT_SHA="$GITHUB_SHA" \
              --build-arg DEPLOYED_AT="$DEPLOYED_AT"; then
            echo "Deploy with mounts failed — retrying with --yes to replace machine"
            flyctl deploy --remote-only -a stockscanner --yes \
              --build-arg GIT_SHA="$GITHUB_SHA" \
              --build-arg DEPLOYED_AT="$DEPLOYED_AT"
          fi
