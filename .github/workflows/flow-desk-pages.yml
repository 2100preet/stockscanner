name: Flow Desk Pages

# Optional mirror to 2100preet/zeroloss (https://2100preet.github.io/zeroloss/).
# Requires secret ZEROLOSS_DEPLOY_TOKEN (PAT with contents:write on zeroloss).
# Primary live site is stockscanner Pages — no extra secret needed.

on:
  workflow_run:
    workflows: ["Signal Desk Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPO: zeroloss
  PAGES_URL: https://2100preet.github.io/zeroloss/

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stockscanner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Require deploy token
        env:
          TOKEN: ${{ secrets.ZEROLOSS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::ZEROLOSS_DEPLOY_TOKEN not set — live site stays at https://2100preet.github.io/stockscanner/"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Download site export from triggering run
        if: env.skip != 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: site-export
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build site locally (manual dispatch)
        if: env.skip != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          mkdir -p outputs
          python -m odte_scanner scan --universe focus --no-paper || true
          python -m odte_scanner export-pages --out site

      - name: Publish site to zeroloss gh-pages
        if: env.skip != 'true'
        env:
          TOKEN: ${{ secrets.ZEROLOSS_DEPLOY_TOKEN }}
          TARGET_REPO: ${{ env.TARGET_REPO }}
          PAGES_URL: ${{ env.PAGES_URL }}
        run: |
          test -f site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/2100preet/${TARGET_REPO}.git" target-repo
          cd target-repo
          git checkout -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../site/* .
          touch .nojekyll
          git add -A
          git diff --staged --quiet && echo "No site changes" || git commit -m "Mirror Flow Desk from stockscanner ${GITHUB_RUN_ID}"
          git push -u origin gh-pages --force
          echo "Published → ${PAGES_URL}"
