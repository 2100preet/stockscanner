name: Signal Desk Pages

on:
  workflow_dispatch:
  schedule:
    # Weekdays: every 30m during US market hours (UTC). Weekends: one refresh so Mon isn't stale.
    - cron: "15,45 13-20 * * 1-5"
    - cron: "0 14 * * 6,0"
  push:
    branches:
      - main
    # Only main may publish to github-pages (env branch policy). Feature-branch
    # push triggers previously cancelled main runs via shared concurrency, then
    # failed deploy — leaving live desk stuck on stale equity.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    # Schedule / dispatch / main-push only; never waste a focus scan on a
    # branch that cannot deploy.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Persist paper journals across Pages rebuilds so EXIT / closed P&L survive.
      # outputs/ is gitignored — without this cache every deploy starts with empty ledgers.
      - name: Restore desk ledgers
        uses: actions/cache@v4
        with:
          path: |
            outputs/signal_journal.json
            outputs/recommendation_log.json
            outputs/challenge_ledger.json
            outputs/odte_1k_ledger.json
            outputs/paper_ledger.json
            outputs/webull_orders.json
            outputs/ui_snapshot_cache.json
            outputs/win_rates.json
            outputs/echo_ladders
          key: desk-ledgers-${{ github.run_id }}
          restore-keys: |
            desk-ledgers-

      # Keep scan short so a hung Yahoo/focus pull cannot block NaN-safe publish.
      - name: Focus scan
        id: scan
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p outputs
          if [ -n "${UNUSUAL_WHALES_API_KEY:-}" ]; then
            echo "UW_API_KEY configured=yes len=${#UNUSUAL_WHALES_API_KEY}"
          else
            echo "UW_API_KEY configured=NO — add repo secret UNUSUAL_WHALES_API_KEY"
          fi
          if [ -n "${TRADIER_ACCESS_TOKEN:-}" ]; then
            echo "TRADIER_TOKEN configured=yes len=${#TRADIER_ACCESS_TOKEN}"
          else
            echo "TRADIER_TOKEN configured=NO — add repo secret TRADIER_ACCESS_TOKEN"
          fi
          python -m odte_scanner scan --universe focus --no-paper
        env:
          PYTHONUNBUFFERED: "1"
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          TRADIER_SANDBOX: ${{ secrets.TRADIER_SANDBOX }}

      - name: Export static site
        env:
          PYTHONUNBUFFERED: "1"
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          TRADIER_SANDBOX: ${{ secrets.TRADIER_SANDBOX }}
        run: |
          mkdir -p outputs
          if [ -n "${UNUSUAL_WHALES_API_KEY:-}" ]; then
            echo "UW_API_KEY configured=yes len=${#UNUSUAL_WHALES_API_KEY}"
          else
            echo "UW_API_KEY configured=NO — add repo secret UNUSUAL_WHALES_API_KEY"
          fi
          if [ -n "${TRADIER_ACCESS_TOKEN:-}" ]; then
            echo "TRADIER_TOKEN configured=yes len=${#TRADIER_ACCESS_TOKEN} sandbox=${TRADIER_SANDBOX:-unset} account=${TRADIER_ACCOUNT_ID:+set}"
          else
            echo "TRADIER_TOKEN configured=NO — add repo secret TRADIER_ACCESS_TOKEN"
          fi
          python -m odte_scanner export-pages --out site
          test -f site/index.html
          test -f site/data/snapshot.json
          # Bundle ledgers into the static site for transparency / debugging
          mkdir -p site/data/ledgers
          for f in signal_journal.json recommendation_log.json challenge_ledger.json odte_1k_ledger.json paper_ledger.json webull_orders.json ui_snapshot_cache.json; do
            if [ -f "outputs/$f" ]; then cp "outputs/$f" "site/data/ledgers/$f"; fi
          done
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("site/data/snapshot.json").read_text()
          # Browsers reject NaN/Infinity; Python json.loads accepts them — check raw text.
          bad = re.findall(r"\b(?:NaN|-?Infinity)\b", raw)
          assert not bad, f"snapshot.json not browser-safe: found {bad[:5]!r} ({len(bad)} total)"
          json.loads(raw, parse_constant=lambda x: (_ for _ in ()).throw(ValueError(x)))

          meta = json.loads(Path("site/meta.json").read_text())
          print("scores:", meta.get("scores"), "at", meta.get("generated_at"))
          snap = json.loads(raw)
          assert "scores" in snap
          acts = snap.get("actions") or {}
          journ = (snap.get("insights") or {})
          uw = acts.get("uw_flow") or (snap.get("challenge") or {}).get("uw_flow") or {}
          tr = snap.get("tradier") or acts.get("tradier") or {}
          print(
              "sell_now:", (acts.get("counts") or {}).get("sell_now"),
              "buy_puts:", (acts.get("counts") or {}).get("buy_now_puts"),
              "closed_journal:", journ.get("closed_trades") and len(journ.get("closed_trades") or []),
              "just_exited:", len(acts.get("just_exited") or []),
              "uw_ok:", uw.get("ok"),
              "uw_configured:", uw.get("configured"),
              "uw_alerts:", uw.get("alerts_n"),
              "tradier_configured:", tr.get("configured"),
              "tradier_ok:", tr.get("ok"),
              "tradier_clock:", (tr.get("clock") or {}).get("state"),
              "data_confidence:", (snap.get("data_confidence") or acts.get("data_confidence") or {}).get("pct"),
          )
          ch = snap.get("challenge") or {}
          book = ch.get("book") or {}
          print(
              "challenge_equity:", ch.get("current_equity") or book.get("equity"),
              "epoch:", book.get("epoch"),
              "challenge_error:", ch.get("error"),
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload site export (zeroloss mirror)
        uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: site
          retention-days: 3

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
