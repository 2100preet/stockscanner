# ZeroLoss live desk on Fly.io
# Deploy: fly deploy -a stockscanner
# Scale:  fly scale memory 2048 -a stockscanner
# redeploy-nudge: 2026-10-13T01:20Z (revive hung /api/snapshot)

app = "stockscanner"
primary_region = "iad"

[build]

[env]
  PORT = "8787"
  LIVE_DESK_LOOP = "1"
  FAST_DESK_LOOP = "1"
  FAST_DESK_PAUSE_SEC = "20"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep the desk awake — auto-stop kills the scan worker
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

# Persist paper ledgers / signal times across deploys
[mounts]
  source = "desk_outputs"
  destination = "/app/outputs"

