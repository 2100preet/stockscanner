# ZeroLoss live desk on Fly.io
# Deploy: fly deploy -a stockscanner
# Scale:  fly scale memory 4096 -a stockscanner
# Volume: fly volumes create desk_outputs --region ord --size 1 -a stockscanner
# redeploy-nudge: 2026-10-09T13:45Z buy-now-tape-oom

app = "stockscanner"
primary_region = "ord"

[build]

[env]
  PORT = "8787"
  LIVE_DESK_LOOP = "1"
  PYTHONUNBUFFERED = "1"
  PAGES_SEED_URL = "https://2100preet.github.io/stockscanner/data/latest_scan.json"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep the desk awake — auto-stop kills the scan worker
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/"

[mounts]
  source = "desk_outputs"
  destination = "/app/outputs"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
